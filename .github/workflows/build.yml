name: Makefile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Starting build
        run: ./scripts/build.sh
        
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: reverse
          path: ./reverse
          
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: reverse
          
      - name: Fixing possible executable permissions
        run: chmod +x ./reverse
       
      - name: Running tests
        run: ./scripts/test.sh
        
        
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Building a deb package
        run: ./scripts/package.sh
      
      - name: Uploading deb package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ./reverse.deb
        
  deploy:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: .
      
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/reverse .
        
      - name: Run Docker container test
        run: docker run ${{ secrets.DOCKERHUB_USERNAME }}/reverse

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/reverse