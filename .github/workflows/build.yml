name: Makefile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Starting build
        run: ./scripts/build.sh
        
      - name: Upload executable
        uses: actions/upload-artifact@v3
        with:
          name: reverse
          path: ./reverse
          
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Download executable
        uses: actions/download-artifact@v3
        with:
          name: reverse
          
      - name: Fixing possible executable permissions
        run: chmod +x ./reverse
       
      - name: Running tests
        run: ./scripts/test.sh
        
        
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Building a deb package
        run: ./scripts/package.sh
        